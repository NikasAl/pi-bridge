<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>pi — мост</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#dfe3ea; --dim:#8a93a6;
    --accent:#4da3ff; --user:#2b5d8f; --ok:#3fb96f; --warn:#e0a93e; --err:#e05555;
    --mono:'Sarasa Mono SC','DejaVu Sans Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:15px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    display:flex; flex-direction:column;
  }
  header{
    display:flex; align-items:center; padding:8px 12px;
    background:var(--panel); border-bottom:1px solid var(--line);
    padding-top:calc(8px + env(safe-area-inset-top));
  }
  #dot{width:10px;height:10px;border-radius:50%;background:var(--err);flex:none}
  #dot.ok{background:var(--ok)} #dot.warn{background:var(--warn)}
  header > * + *{margin-left:8px}
  #model{color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  header button{
    background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;
    padding:4px 10px;font-size:12px;flex:none;
  }
  #log{flex:1;overflow-y:auto;padding:10px 12px 16px;-webkit-overflow-scrolling:touch}
  .row{margin:6px 0;word-wrap:break-word;white-space:pre-wrap;overflow-wrap:anywhere}
  .user{background:var(--user);border-radius:12px 12px 3px 12px;padding:8px 12px;max-width:92%}
  .assistant{padding:2px 2px}
  .thinking{color:var(--dim);font-size:13px;font-style:italic}
  .thinking summary{cursor:pointer;list-style:none;color:var(--dim);font-size:12px}
  .tool{font-family:var(--mono);font-size:12.5px;color:var(--dim);border-left:2px solid var(--line);padding:2px 0 2px 10px;margin:6px 0}
  .tool b{color:var(--text);font-weight:600}
  .tool .st{color:var(--warn)} .tool.done .st{color:var(--ok)} .tool.err .st{color:var(--err)}
  .sys{color:var(--dim);font-size:12px;font-family:var(--mono)}
  .sys.err{color:var(--err)}
  details.raw{color:var(--dim);font-size:11.5px;font-family:var(--mono)}
  details.raw summary{cursor:pointer}
  /* markdown-рендер завершённых сообщений ассистента */
  .md{white-space:normal}
  .md p{margin:.4em 0}
  .md h1,.md h2,.md h3,.md h4{margin:.55em 0 .3em;line-height:1.3}
  .md h1{font-size:1.25em}.md h2{font-size:1.15em}.md h3{font-size:1.05em}.md h4{font-size:1em}
  .md ul,.md ol{margin:.4em 0;padding-left:1.4em}
  .md li{margin:.15em 0}
  .md code{font-family:var(--mono);font-size:.9em;background:#1d2230;border-radius:4px;padding:1px 5px}
  .md pre{background:#1d2230;border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-x:auto;margin:.5em 0}
  .md pre code{background:none;padding:0;white-space:pre}
  .md blockquote{border-left:3px solid var(--line);margin:.4em 0;padding:2px 10px;color:var(--dim)}
  .md a{color:var(--accent)}
  .md hr{border:none;border-top:1px solid var(--line);margin:.8em 0}
  #jump{
    position:absolute;right:14px;bottom:86px;display:none;
    border:1px solid var(--line);background:var(--panel);color:var(--text);
    border-radius:20px;padding:8px 14px;
  }
  #bar{
    border-top:1px solid var(--line);background:var(--panel);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  }
  #ctrl{display:none;align-items:center;margin-bottom:6px;font-size:12px;color:var(--dim)}
  #ctrl.on{display:flex}
  #ctrl > * + *{margin-left:8px}
  #runbadge{color:var(--warn)}
  #qinfo{flex:1}
  #ctrl button{border:1px solid var(--line);background:none;color:var(--text);border-radius:8px;padding:4px 10px;font-size:12px}
  #ctrl button.stop{border-color:var(--err);color:var(--err)}
  #mode.steer{color:var(--accent)} #mode.follow{color:var(--ok)}
  #inrow{display:flex;align-items:flex-end}
  #inrow > * + *{margin-left:8px}
  textarea{
    flex:1;resize:none;background:var(--bg);color:var(--text);
    border:1px solid var(--line);border-radius:12px;padding:9px 12px;
    font:inherit;max-height:120px;outline:none;
  }
  textarea:focus{border-color:var(--accent)}
  #send{
    flex:none;border:none;border-radius:50%;background:var(--accent);color:#fff;
    width:42px;height:42px;display:flex;align-items:center;justify-content:center;
  }
  /* панель сессий */
  #drawer{
    display:none;position:fixed;z-index:10;left:0;right:0;top:0;
    max-height:75%;overflow-y:auto;background:var(--panel);
    border-bottom:2px solid var(--line);padding:10px 12px;
    padding-top:calc(10px + env(safe-area-inset-top));
  }
  #drawer.open{display:block}
  .dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  /* <details> без нативной поддержки (старые iOS): раскрывание через .xopen */
  details:not([open]):not(.xopen) > *:not(summary){display:none}
  .dhead button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:4px 10px;font-size:12px}
  .srow{display:flex;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line)}
  .srow > * + *{margin-left:6px}
  .sname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
  .sname.cur{color:var(--accent);font-weight:600}
  .srun{color:var(--warn);font-size:11px;flex:none}
  .srow button{
    background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;
    padding:3px 8px;font-size:11px;flex:none;
  }
  .srow button.danger{border-color:var(--err);color:var(--err)}
  #dnew{margin-top:10px;width:100%;background:none;border:1px dashed var(--line);color:var(--text);border-radius:8px;padding:8px;font-size:13px}
</style>
</head>
<body>
<header>
  <div id="dot"></div>
  <div id="model">подключение…</div>
  <button id="tabs">сессии</button>
</header>

<div id="drawer">
  <div class="dhead"><b>Сессии</b><button id="dclose">закрыть</button></div>
  <div id="slist"></div>
  <button id="dnew">+ новая сессия</button>
</div>

<div id="log"></div>
<button id="jump">вниз</button>

<div id="bar">
  <div id="ctrl">
    <span id="runbadge">агент работает</span>
    <span id="qinfo"></span>
    <button id="mode" class="steer">steer</button>
    <button id="abort" class="stop">стоп</button>
  </div>
  <div id="inrow">
    <textarea id="in" rows="1" placeholder="Сообщение…"></textarea>
    <button id="send" title="Отправить" aria-label="Отправить">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
    </button>
  </div>
</div>

<script src="md.js"></script>
<script>
// полифилл <details>/<summary> для Safari < 12.1 (стара iOS): кликом по summary
// тумбулится класс .xopen, CSS скрывает/показывает содержимое
(function(){
  if (typeof HTMLDetailsElement !== 'undefined') return;
  document.addEventListener('click', function(e){
    var t = e.target;
    while (t && t.tagName !== 'SUMMARY') t = t.parentNode;
    if (t && t.parentNode) t.parentNode.classList.toggle('xopen');
  });
})();
</script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const logEl = $('log'), dot = $('dot'), modelEl = $('model'), inEl = $('in');

let ws = null, retryMs = 1000, reconnectTimer = null;
let streaming = false;          // агент работает
let mode = 'steer';             // steer | follow_up — куда уйдёт сообщение во время стриминга
let stick = true;               // прилеплены ли к низу лога
let lastSent = '';              // для дедупликации эха user-сообщений
let curText = null;             // текущий ассистентский текстовый блок
let curThink = null;            // текущий thinking-блок (details)
let sessions = [];              // [{id,name,alive,streaming}]
let activeId = null;            // текущая привязанная сессия
// помним активную сессию пережив (пере)загрузку/сон: после гашения экрана телефона
// новое WS-соединение иначе упало бы в первую сессию (серверный авто-attach)
const LS_ACTIVE = 'piBridgeActiveSession';
function saveActive(id){ try { localStorage.setItem(LS_ACTIVE, String(id)); } catch (e) {} }
function loadActive(){ try { return localStorage.getItem(LS_ACTIVE); } catch (e) { return null; } }
const statusState = { model: null, think: null, ctx: null, streaming: false, piUp: null };
const toolLines = new Map();    // toolCallId -> элемент строки инструмента

/* ---------- утилиты DOM ---------- */
function scrollBottom(){ logEl.scrollTop = logEl.scrollHeight; }
function checkStick(){ stick = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 90; }
function add(el){ checkStick(); logEl.appendChild(el); if (stick) scrollBottom(); }
function div(cls, text){ const d = document.createElement('div'); if (cls) d.className = cls; if (text != null) d.textContent = text; return d; }
function sysLine(text, isErr){ const d = div('sys' + (isErr ? ' err' : ''), text); add(d); return d; }
function rawDetails(label, obj){
  const det = document.createElement('details'); det.className = 'raw';
  const s = document.createElement('summary'); s.textContent = label; det.appendChild(s);
  det.appendChild(document.createTextNode(JSON.stringify(obj, null, 1).slice(0, 4000)));
  return det;
}
function short(s, n){ s = String(s); return s.length > n ? s.slice(0, n) + '…' : s; }
function fmtK(n){ return n >= 1000 ? Math.round(n / 1000) + 'k' : String(n); }
function wsSend(obj){
  if (ws && ws.readyState === ws.OPEN) ws.send(JSON.stringify(obj));
  else sysLine('нет соединения', true);
}

/* ---------- строка статуса: модель · контекст · мышление ---------- */
function renderStatus(cls){
  let d = cls;
  if (!d) d = statusState.piUp === false ? 'warn' : (ws && ws.readyState === ws.OPEN ? 'ok' : 'err');
  dot.className = d;
  const parts = [];
  if (statusState.model) parts.push(statusState.model);
  if (statusState.ctx) parts.push('ctx ' + statusState.ctx);
  if (statusState.think && statusState.think !== 'off') parts.push('мысли ' + statusState.think);
  if (statusState.streaming) parts.push('работает');
  modelEl.textContent = parts.length ? parts.join(' · ') : 'подключение…';
}
function applyState(o){
  if (o.model) statusState.model = o.model.name || o.model.id;
  if ('thinkingLevel' in o) statusState.think = o.thinkingLevel;
  if ('isStreaming' in o) statusState.streaming = !!o.isStreaming;
  renderStatus('ok');
}
function applyStats(d){
  const cu = d && d.contextUsage;
  if (cu && cu.contextWindow){
    statusState.ctx = (cu.percent != null ? Math.round(cu.percent) + '%' : fmtK(cu.tokens)) +
      ' (' + fmtK(cu.tokens) + '/' + fmtK(cu.contextWindow) + ')';
  } else statusState.ctx = null;
  renderStatus();
}

/* ---------- рендер лога ---------- */
function userBubble(text){ add(div('row user', text)); }

function ensureText(){
  if (!curText){ curText = div('row assistant', ''); add(curText); }
  return curText;
}
function ensureThink(){
  if (!curThink){
    const det = document.createElement('details'); det.className = 'row thinking';
    const s = document.createElement('summary'); s.textContent = 'размышления';
    det.appendChild(s);
    const body = document.createElement('div'); det.appendChild(body);
    det._body = body; add(det); curThink = det;
  }
  return curThink._body;
}
function closeStreams(){ curText = null; curThink = null; }

/* маркдаун — только для завершённых сообщений ассистента (во время стриминга — plain text) */
function mdBlock(text){
  const d = div('row assistant md');
  d.innerHTML = window.piMd.render(text); // piMd экранирует HTML сам
  return d;
}

function toolLineStart(id, name, args){
  const d = div('tool');
  const b = document.createElement('b'); b.textContent = name || 'tool'; d.appendChild(b);
  const st = document.createElement('span'); st.className = 'st'; st.textContent = ' …'; d.appendChild(st);
  const pre = document.createElement('div'); pre.textContent = args ? short(JSON.stringify(args), 300) : '';
  pre.style.whiteSpace = 'pre-wrap'; d.appendChild(pre);
  d._st = st;
  if (id) toolLines.set(id, d);
  add(d);
  return d;
}
function toolLineEnd(id, isError, resultText){
  const d = id && toolLines.get(id);
  if (!d) return;
  d.classList.add(isError ? 'err' : 'done');
  d._st.textContent = isError ? ' ошибка' : ' готово';
  if (resultText){
    const det = document.createElement('details');
    const s = document.createElement('summary'); s.textContent = 'результат';
    det.appendChild(s);
    det.appendChild(document.createTextNode(short(resultText, 6000)));
    d.appendChild(det);
  }
  toolLines.delete(id);
}

/* полная пересборка лога из истории — устраняет и дубли, и пропуски после обрыва */
function rebuildLog(messages){
  logEl.textContent = '';
  toolLines.clear();
  closeStreams();
  lastSent = '';
  stick = true;
  if (Array.isArray(messages)){
    for (const m of messages){
      try { renderHistoryMessage(m); } catch (e) { add(rawDetails('сообщение (не разобрано)', m)); }
    }
    sysLine('— история сессии (' + messages.length + ' сообщений) —');
  }
  scrollBottom();
}
function contentText(c){
  if (typeof c === 'string') return c;
  if (Array.isArray(c)) return c.filter(b => b && (b.type === 'text' || typeof b === 'string'))
    .map(b => typeof b === 'string' ? b : b.text).join('');
  return c && c.text ? c.text : '';
}
function renderHistoryMessage(m){
  const role = m.role || (m.message && m.message.role);
  const content = m.content != null ? m.content : (m.message && m.message.content);
  if (role === 'user'){ userBubble(contentText(content) || '[пусто]'); return; }
  if (role === 'assistant'){
    if (Array.isArray(content)){
      for (const b of content){
        if (!b || typeof b !== 'object') continue;
        if (b.type === 'text' && b.text) add(mdBlock(b.text));
        else if (b.type === 'thinking' && b.thinking) add(div('row thinking', short(b.thinking, 800)));
        else if (/toolcall|tool_call|toolCall/.test(b.type || '')){
          toolLineStart(null, b.name || b.toolName || 'tool', b.arguments || b.args || null);
        } else add(rawDetails('блок ' + (b.type || '?'), b));
      }
    } else if (contentText(content)) add(mdBlock(contentText(content)));
    return;
  }
  if (/tool/i.test(role || '')){
    const t = contentText(content);
    if (t) add(div('sys', 'результат инструмента: ' + short(t, 300)));
    return;
  }
  add(rawDetails('роль ' + (role || '?'), m));
}

/* ---------- обработка событий pi ---------- */
function setStreaming(v){
  streaming = v;
  statusState.streaming = v;
  $('ctrl').classList.toggle('on', v);
  $('mode').textContent = mode === 'steer' ? 'steer' : 'follow-up';
  $('mode').className = mode === 'steer' ? 'steer' : 'follow';
  renderStatus();
}

function handleEvent(o){
  switch (o.type){
    case 'response': {
      if (o.command === 'get_state'){
        if (o.success){ applyState(o.data || {}); setStreaming(!!(o.data && o.data.isStreaming)); }
        break;
      }
      if (o.command === 'get_session_stats'){
        if (o.success) applyStats(o.data || {});
        break;
      }
      if (o.command === 'get_messages'){
        // пересобираем лог на КАЖДОЕ получение истории (и на первом входе, и после ресинка):
        // нет дублей и нет пропусков событий, случившихся во время обрыва
        if (o.success) rebuildLog(o.data && o.data.messages);
        break;
      }
      if (o.command === 'prompt' || o.command === 'steer' || o.command === 'follow_up'){
        const d = o.data || {};
        sysLine((o.command === 'prompt' ? 'отправлено' : 'в очередь (' + o.command + ')') +
          (o.success ? ' [' + (d.disposition || 'ok') + ']' : '') + (o.success ? '' : ': ' + (o.error || 'ошибка')), !o.success);
        break;
      }
      if (o.success === false) sysLine(o.command + ': ' + (o.error || 'ошибка'), true);
      break;
    }
    case 'message_start': {
      const m = o.message || {};
      if (m.role === 'user'){
        const t = contentText(m.content);
        if (t && t === lastSent) break;      // свой локальный эхо уже показан
        userBubble(t || '[пусто]');
      }
      break;
    }
    case 'message_update': {
      const e = o.assistantMessageEvent;
      if (!e) break;
      switch (e.type){
        case 'text_start': curThink = null; curText = null; ensureText(); break;
        case 'text_delta': ensureText().textContent += e.delta || ''; break;
        case 'text_end': {
          const el = curText;
          if (el){
            const full = e.content != null ? e.content : el.textContent;
            el.innerHTML = window.piMd.render(full);
            el.classList.add('md');
          }
          curText = null;
          break;
        }
        case 'thinking_start': curText = null; ensureThink(); break;
        case 'thinking_delta': ensureThink().textContent += e.delta || ''; break;
        case 'thinking_end': curThink = null; break;
        case 'toolcall_start': closeStreams(); toolLineStart(e.id, e.toolName, null); break;
        case 'toolcall_delta': break; // накопление аргументов не показываем
        case 'toolcall_end': {
          const tc = e.toolCall || {};
          const d = e.id && toolLines.get(e.id);
          if (d){
            const pre = d.children[2];
            pre.textContent = short(JSON.stringify(tc.arguments || tc.args || tc), 300);
          }
          break;
        }
        case 'error': sysLine('ошибка модели: ' + (e.error || e.reason), true); break;
        default: break; // start/done и пр. — служебные
      }
      break;
    }
    case 'tool_execution_start':
      toolLineStart(o.toolCallId, o.toolName, o.args);
      break;
    case 'tool_execution_update': break; // частичный вывод не спамим в лог
    case 'tool_execution_end': {
      const r = o.result || {};
      const text = Array.isArray(r.content)
        ? r.content.filter(b => b && b.type === 'text').map(b => b.text).join('\n')
        : (typeof r === 'string' ? r : '');
      toolLineEnd(o.toolCallId, !!o.isError, text);
      break;
    }
    case 'agent_start': setStreaming(true); break;
    case 'agent_end': if (o.willRetry) sysLine('агент завершит попытку и повторит…'); break;
    case 'agent_settled':
      setStreaming(false);
      // обновить контекст/мышление после завершения хода
      wsSend({ type: 'get_state' });
      wsSend({ type: 'get_session_stats' });
      break;
    case 'queue_update': {
      const s = (o.steering || []).length, f = (o.followUp || []).length;
      $('qinfo').textContent = (s || f) ? ('в очереди: ' + (s ? s + ' steer ' : '') + (f ? f + ' follow' : '')) : '';
      break;
    }
    case 'auto_retry_start': sysLine('auto-retry #' + o.attempt + ' через ' + o.delayMs + ' мс: ' + (o.errorMessage || ''), true); break;
    case 'compaction_start': sysLine('компакция контекста…'); break;
    case 'compaction_end':
      sysLine('компакция завершена');
      wsSend({ type: 'get_session_stats' });
      break;
    case 'bash_execution_update': break; // живой вывод bash в лог не дублируем
    case 'extension_ui_request': add(rawDetails('запрос UI расширения (не поддержан)', o)); break;
    default:
      if (!/^bridge_/.test(o.type || '')) add(rawDetails(o.type || 'unknown', o));
  }
}

/* ---------- панель сессий ---------- */
function renderSessions(){
  const list = $('slist');
  list.textContent = '';
  for (const s of sessions){
    const row = div('srow');
    if (s.streaming){ const b = document.createElement('span'); b.className = 'srun'; b.textContent = 'работает'; row.appendChild(b); }
    const nm = div('sname' + (s.id === activeId ? ' cur' : ''), s.name);
    nm.onclick = () => { wsSend({ type: 'bridge_attach', session: s.id }); toggleDrawer(false); };
    row.appendChild(nm);
    const ren = document.createElement('button'); ren.textContent = 'переим.';
    ren.onclick = () => {
      const n = prompt('Новое имя сессии:', s.name);
      if (n && n.trim()) wsSend({ type: 'bridge_rename_session', session: s.id, name: n.trim() });
    };
    const del = document.createElement('button'); del.textContent = 'удалить'; del.className = 'danger';
    del.onclick = () => {
      if (confirm('Удалить сессию «' + s.name + '»? Процесс будет остановлен, файл сессии удалён с диска.')){
        wsSend({ type: 'bridge_delete_session', session: s.id });
        toggleDrawer(false);
      }
    };
    row.appendChild(ren); row.appendChild(del);
    list.appendChild(row);
  }
}
function toggleDrawer(v){ $('drawer').classList.toggle('open', v); }

/* ---------- события моста ---------- */
function handleBridge(o){
  switch (o.type){
    case 'bridge_hello':
      sessions = o.sessions || [];
      activeId = o.active;
      saveActive(o.active);
      statusState.piUp = !!o.piRunning;
      renderStatus(o.piRunning ? 'ok' : 'warn');
      renderSessions();
      wsSend({ type: 'get_session_stats' });
      break;
    case 'bridge_sessions':
      sessions = o.sessions || [];
      renderSessions();
      break;
    case 'bridge_status':
      if (o.status === 'pi_up'){ statusState.piUp = true; renderStatus('ok'); }
      else if (o.status === 'pi_down'){ statusState.piUp = false; renderStatus('warn'); setStreaming(false); sysLine('процесс pi завершился (code=' + o.code + '), перезапуск…'); }
      else if (o.status === 'pi_error'){ statusState.piUp = false; renderStatus('err'); sysLine('pi: ' + o.error, true); }
      break;
    case 'bridge_stderr': sysLine('pi stderr: ' + short(o.line, 500), true); break;
    case 'bridge_raw': sysLine('pi stdout (не JSON): ' + short(o.line, 500)); break;
    case 'bridge_error': sysLine('мост: ' + o.error, true); break;
  }
}

/* ---------- WebSocket ---------- */
function connect(){
  // Идемпотентность: если живое соединение уже есть/устанавливается — не создаём второе.
  // Именно отсутствие этой проверки вызывало задвоение сообщений после сна телефона:
  // таймер ретрая и visibilitychange создавали параллельные сокеты.
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
  if (reconnectTimer){ clearTimeout(reconnectTimer); reconnectTimer = null; }
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const base = location.pathname.replace(/\/+$/, '');
  renderStatus('warn');
  modelEl.textContent = 'подключение…';
  const saved = loadActive();
  const sock = new WebSocket(proto + '://' + location.host + base + '/ws' +
    (saved ? '?session=' + encodeURIComponent(saved) : ''));
  ws = sock;
  sock.onopen = () => { retryMs = 1000; };
  sock.onmessage = (ev) => {
    if (ev.target !== ws){ try { ev.target.close(); } catch (e) {} return; } // игнор устаревших сокетов
    let o; try { o = JSON.parse(ev.data); } catch (e) { return; }
    if (/^bridge_/.test(o.type || '')) handleBridge(o); else handleEvent(o);
  };
  sock.onclose = () => {
    if (ws !== sock) return; // закрылся устаревший сокет — ретраи не нужны
    statusState.piUp = null;
    renderStatus('err');
    setStreaming(false);
    reconnectTimer = setTimeout(connect, retryMs);
    retryMs = Math.min(retryMs * 1.7, 10000);
  };
  sock.onerror = () => { try { sock.close(); } catch (e) {} };
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) connect(); // connect() сам проверит, не открыто ли уже
});

/* ---------- отправка ---------- */
function send(){
  const text = inEl.value.trim();
  if (!text) return;
  if (!ws || ws.readyState !== ws.OPEN){ sysLine('нет соединения', true); return; }
  const msg = streaming
    ? { id: 'c' + Date.now(), type: mode, message: text }
    : { id: 'c' + Date.now(), type: 'prompt', message: text };
  wsSend(msg);
  lastSent = text;
  userBubble(text + (streaming ? (mode === 'steer' ? '  [steer]' : '  [follow-up]') : ''));
  inEl.value = ''; inEl.style.height = 'auto';
}
$('send').onclick = send;
inEl.addEventListener('input', () => { inEl.style.height = 'auto'; inEl.style.height = Math.min(inEl.scrollHeight, 120) + 'px'; });
inEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); send(); }
});
$('abort').onclick = () => wsSend({ type: 'abort' });
$('mode').onclick = () => { mode = mode === 'steer' ? 'follow_up' : 'steer'; setStreaming(streaming); };
$('tabs').onclick = () => toggleDrawer(!$('drawer').classList.contains('open'));
$('dclose').onclick = () => toggleDrawer(false);
$('dnew').onclick = () => { wsSend({ type: 'bridge_create_session' }); toggleDrawer(false); };
$('jump').onclick = () => { stick = true; scrollBottom(); };
logEl.addEventListener('scroll', () => {
  const atBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 90;
  stick = atBottom; $('jump').style.display = atBottom ? 'none' : 'block';
});

connect();
</script>
